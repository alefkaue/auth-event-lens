name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/AuthEventLens/AuthEventLens.csproj -c Release
      - run: dotnet run --project tests/AuthEventLens.Tests -c Release
      - run: dotnet run --project src/AuthEventLens -c Release --no-build -- examples/clean.jsonl
